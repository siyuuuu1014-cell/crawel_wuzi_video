[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-video-crawler"
version = "0.1.0"
description = "License-aware downloader for free stock video APIs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "free-video-crawler contributors"}]
dependencies = []

[project.scripts]
free-video-crawler = "video_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

